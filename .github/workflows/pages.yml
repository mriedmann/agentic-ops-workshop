name: Slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install reveal.js
        run: npm ci

      - name: Check slides
        run: npm run check:strict

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/node_modules/reveal.js
          cp index.html styles.css presentation.js _site/
          cp -r media _site/media
          # Only the parts of reveal.js the deck actually loads, plus its license.
          cp -r node_modules/reveal.js/dist _site/node_modules/reveal.js/dist
          cp -r node_modules/reveal.js/plugin _site/node_modules/reveal.js/plugin
          cp node_modules/reveal.js/LICENSE _site/node_modules/reveal.js/LICENSE
          cp LICENSE _site/LICENSE

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
